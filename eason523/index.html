<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">GitHub 全网开源项目搜索</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 顶部控制面板 */
    header {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e293b, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 界面语言切换按钮 */
    .lang-toggle-btn {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      padding: 6px 14px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }

    .lang-toggle-btn:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    /* 搜索栏区域 */
    .search-bar {
      display: flex;
      gap: 12px;
      position: relative;
      width: 100%;
    }

    .search-input-wrapper {
      position: relative;
      flex-grow: 1;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      outline: none;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }

    .clear-btn:hover {
      background: var(--border-color);
      color: var(--text-main);
    }

    .clear-btn.visible {
      display: flex;
    }

    .search-submit-btn {
      padding: 0 24px;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s;
      white-space: nowrap;
    }

    .search-submit-btn:hover {
      background: var(--primary-hover);
    }

    /* 联想词下拉菜单 */
    .search-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      z-index: 10;
      max-height: 280px;
      overflow-y: auto;
      display: none;
    }

    .search-suggestions.show {
      display: block;
    }

    .suggestion-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: var(--bg-color);
      color: var(--primary-color);
    }

    /* 筛选与排序栏 */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .lang-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .filter-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    .sort-select {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* 项目卡片网格 */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .card-title a {
      color: var(--primary-color);
      text-decoration: none;
    }

    .card-title a:hover {
      text-decoration: underline;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary-color);
      display: inline-block;
    }

    /* 空状态与加载状态 */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }

    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <h1 id="uiTitle">GitHub 全网开源项目搜索</h1>
        <div class="controls-group">
          <!-- 中英文模式切换按钮 -->
          <button id="uiLangToggle" class="lang-toggle-btn" onclick="toggleAppLanguage()">English</button>
        </div>
      </div>

      <!-- 全网搜索栏 -->
      <div class="search-bar">
        <div class="search-input-wrapper">
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="输入关键词全网搜索 GitHub 仓库..." 
            autocomplete="off"
          />
          <button id="clearSearchBtn" class="clear-btn" title="清空" onclick="clearSearchInput()">✕</button>
          <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
        <button id="btnSearch" class="search-submit-btn" onclick="handleSearchSubmit()">搜索</button>
      </div>

      <!-- 语言与排序过滤栏 -->
      <div class="filter-bar">
        <div id="languageFilters" class="lang-filters">
          <button id="langAll" class="filter-btn active" onclick="filterByLanguage('all', this)">全部语言</button>
          <button class="filter-btn" onclick="filterByLanguage('JavaScript', this)">JavaScript</button>
          <button class="filter-btn" onclick="filterByLanguage('Python', this)">Python</button>
          <button class="filter-btn" onclick="filterByLanguage('C++', this)">C++</button>
          <button class="filter-btn" onclick="filterByLanguage('TypeScript', this)">TypeScript</button>
          <button class="filter-btn" onclick="filterByLanguage('HTML', this)">HTML</button>
        </div>

        <select id="sortSelect" class="sort-select" onchange="handleSortChange(this.value)">
          <option value="stars" id="sortStars">按 Star 排序</option>
          <option value="forks" id="sortForks">按 Fork 排序</option>

          <option value="updated" id="sortUpdated">按最近更新排序</option>
        </select>
      </div>
    </header>

    <main>
      <div id="projectsContainer" class="projects-grid">
        <div class="loading-state" id="uiLoading">正在加载全网热门项目...</div>
      </div>
    </main>
  </div>

  <script>
    // ==================== 1. 国际化 (i18n) 字典 ====================
    const i18n = {
      'zh-CN': {
        pageTitle: "GitHub 全网开源项目搜索",
        uiTitle: "GitHub 全网开源项目搜索",
        placeholderSearch: "输入关键词全网搜索 GitHub 仓库...",
        btnSearch: "搜索",
        langAll: "全部语言",
        sortStars: "按 Star 排序",
        sortForks: "按 Fork 排序",
        sortUpdated: "按最近更新排序",
        uiLoading: "正在全网检索 GitHub 项目...",
        noDescription: "暂无项目描述",
        emptyResult: "未找到符合条件的全网项目",
        loadFailed: "数据加载失败，请检查网络或稍后重试",
        langToggleBtn: "English"
      },
      'en': {
        pageTitle: "GitHub Global Repository Search",
        uiTitle: "GitHub Global Search",
        placeholderSearch: "Type keywords to search all GitHub repos...",
        btnSearch: "Search",
        langAll: "All Languages",
        sortStars: "Sort by Stars",
        sortForks: "Sort by Forks",
        sortUpdated: "Sort by Recently Updated",
        uiLoading: "Searching GitHub globally...",
        noDescription: "No description provided",
        emptyResult: "No matching GitHub repositories found",
        loadFailed: "Failed to fetch data, please try again later",
        langToggleBtn: "中文"
      }
    };

    // ==================== 2. 全局状态 ====================
    let appLang = 'zh-CN';          // UI 语言Mode: 'zh-CN' 或 'en'
    let currentLanguage = 'all';    // 选中的编程语言过滤器
    let currentSort = 'stars';      // 当前排序条件
    let currentKeyword = '';       // 当前全网搜索的主关键词

    // ==================== 3. 工具函数 ====================
    function debounce(fn, delay = 300) {
      let timer = null;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    function getText(key) {
      return i18n[appLang][key] || key;
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 切换界面语言
    function toggleAppLanguage() {
      appLang = appLang === 'zh-CN' ? 'en' : 'zh-CN';
      updateUIModeLanguage();
    }

    function updateUIModeLanguage() {
      document.getElementById('pageTitle').innerText = getText('pageTitle');
      document.getElementById('uiTitle').innerText = getText('uiTitle');
      document.getElementById('searchInput').placeholder = getText('placeholderSearch');
      document.getElementById('btnSearch').innerText = getText('btnSearch');
      document.getElementById('langAll').innerText = getText('langAll');
      document.getElementById('sortStars').innerText = getText('sortStars');
      document.getElementById('sortForks').innerText = getText('sortForks');
      document.getElementById('sortUpdated').innerText = getText('sortUpdated');
      document.getElementById('uiLangToggle').innerText = getText('langToggleBtn');

      // 重新发起全网 API 请求刷新文案或列表
      executeGlobalSearch();
    }

    // ==================== 4. 核心功能：调用 GitHub API 全网搜索 ====================
    async function executeGlobalSearch() {
      const container = document.getElementById('projectsContainer');
      container.innerHTML = `<div class="loading-state">${getText('uiLoading')}</div>`;

      // 构建全网搜索 Query
      let queryParts = [];
      
      if (currentKeyword.trim()) {
        queryParts.push(currentKeyword.trim());
      } else {
        // 无关键词时，默认全网按高 Star 展示
        queryParts.push('stars:>10000');
      }

      if (currentLanguage !== 'all') {
        queryParts.push(`language:${currentLanguage}`);
      }

      const fullQuery = queryParts.join(' ');
      const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(fullQuery)}&sort=${currentSort}&order=desc&per_page=30`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`${getText('loadFailed')} (${response.status})`);
        }

        const data = await response.json();
        renderProjects(data.items || []);
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>${escapeHTML(err.message)}</p></div>`;
      }
    }

    // 渲染卡片
    function renderProjects(projects) {
      const container = document.getElementById('projectsContainer');
      if (!container) return;

      if (projects.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>${getText('emptyResult')}</p>
          </div>`;
        return;
      }

      container.innerHTML = projects.map(project => `
        <div class="project-card">
          <div>
            <div class="card-title">
              <a href="${project.html_url}" target="_blank" rel="noopener noreferrer">
                ${escapeHTML(project.full_name || project.name)}
              </a>
            </div>
            <div class="card-desc">
              ${escapeHTML(project.description || getText('noDescription'))}
            </div>
          </div>
          <div class="card-meta">
            ${project.language ? `
              <span class="meta-tag">
                <span class="lang-dot"></span>
                ${escapeHTML(project.language)}
              </span>
            ` : ''}
            <span class="meta-tag">★ ${(project.stargazers_count || 0).toLocaleString()}</span>
            <span class="meta-tag">⌥ ${(project.forks_count || 0).toLocaleString()}</span>
          </div>
        </div>
      `).join('');
    }

    // 全网关键词实时联想
    async function fetchSearchSuggestions(query) {
      const suggestionsBox = document.getElementById('searchSuggestions');
      if (!query.trim()) {
        suggestionsBox.classList.remove('show');
        return;
      }

      try {
        const response = await fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&per_page=5`);
        if (!response.ok) return;

        const data = await response.json();
        const items = data.items || [];

        if (items.length === 0) {
          suggestionsBox.classList.remove('show');
          return;
        }

        suggestionsBox.innerHTML = items.map(item => `
          <div class="suggestion-item" onclick="selectSuggestion('${escapeHTML(item.name)}')">
            <span><strong>${escapeHTML(item.full_name)}</strong></span>
            <span style="font-size: 0.8rem; color: var(--text-muted);">★ ${item.stargazers_count}</span>
          </div>
        `).join('');
        suggestionsBox.classList.add('show');
      } catch (err) {
        suggestionsBox.classList.remove('show');
      }
    }

    function selectSuggestion(repoName) {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = repoName;
      currentKeyword = repoName;
      document.getElementById('searchSuggestions').classList.remove('show');
      toggleClearButton(true);
      executeGlobalSearch();
    }

    // ==================== 5. 事件处理 ====================
    function handleSearchSubmit() {
      const val = document.getElementById('searchInput').value;
      currentKeyword = val;
      document.getElementById('searchSuggestions').classList.remove('show');
      executeGlobalSearch();
    }

    function filterByLanguage(language, btnElement) {
      currentLanguage = language;
      document.querySelectorAll('#languageFilters .filter-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      }
      executeGlobalSearch();
    }

    function handleSortChange(sortValue) {
      currentSort = sortValue;
      executeGlobalSearch();
    }

    function clearSearchInput() {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = '';
      currentKeyword = '';
      toggleClearButton(false);
      document.getElementById('searchSuggestions').classList.remove('show');
      executeGlobalSearch();
      searchInput.focus();
    }

    function toggleClearButton(visible) {
      const clearBtn = document.getElementById('clearSearchBtn');
      clearBtn.classList.toggle('visible', visible);
    }

    function setupEventListeners() {
      const searchInput = document.getElementById('searchInput');

      // 输入框防抖联想
      const handleInput = debounce((e) => {
        const val = e.target.value;
        toggleClearButton(val.length > 0);
        fetchSearchSuggestions(val);
      }, 300);

      searchInput.addEventListener('input', handleInput);

      // 回车直接发起全网 API 搜索
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          handleSearchSubmit();
        }
      });

      // 点击外部关闭下拉菜单
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-input-wrapper')) {
          document.getElementById('searchSuggestions').classList.remove('show');
        }
      });
    }

    // ==================== 6. 初始化 ====================
    document.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
      executeGlobalSearch();
    });
  </script>
</body>
</html>
